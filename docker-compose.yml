# LogFlow — pile complète en une commande :
#   cp .env.example .env   &&   docker compose up -d
# Puis ouvrez http://localhost:8085  (login par défaut : admin / logflow2026)
services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-change_me_root}
      MARIADB_DATABASE: ${DB_NAME:-logflow}
      MARIADB_USER: ${DB_USER:-logflow}
      MARIADB_PASSWORD: ${DB_PASS:-change_me_logflow}
      # Fuseau horaire de la base (NOW() sur les logs). Défaut UTC.
      TZ: ${TZ:-UTC}
    volumes:
      - db_data:/var/lib/mysql
      # Schéma chargé à la première création du volume, puis le jeu de démo
      - ./install.sql:/docker-entrypoint-initdb.d/01-install.sql:ro
      - ./db/demo-data.sql:/docker-entrypoint-initdb.d/02-demo-data.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s   # laisse le temps à l'init du volume + chargement SQL

  app:
    # Image pré-construite (publiée par le workflow GitHub Actions sur les tags).
    # `build: .` reste un repli pour les forks / le développement local.
    image: ghcr.io/the-dctx/logflow:latest
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-logflow}
      DB_USER: ${DB_USER:-logflow}
      DB_PASS: ${DB_PASS:-change_me_logflow}
      SERVER_URL: ${SERVER_URL:-}
      SYSLOG_PROTO: both
      # Données de démo : 1 = dashboard pré-peuplé (défaut) ; 0 = install à vide.
      DEMO_DATA: ${DEMO_DATA:-1}
      # Fuseau horaire de l'app (affichage). Doit correspondre à celui de la base.
      # Défaut UTC ; ex. TZ=Europe/Paris pour une heure locale sans décalage.
      TZ: ${TZ:-UTC}
    ports:
      - "${APP_PORT:-8085}:80"
      # Récepteur syslog (Synology/NAS). Pointez le Log Center du NAS sur ce port.
      - "${SYSLOG_PORT:-1514}:1514/udp"
      - "${SYSLOG_PORT:-1514}:1514/tcp"

volumes:
  db_data:
